version: '3.8'

services:
  db:
    image: postgres:17
    container_name: javeiro-postgres
    environment:
      POSTGRES_USER: luiz
      POSTGRES_PASSWORD: luiz123
      POSTGRES_DB: crescer-aprender-db
    ports:
      - "5432:5432"
    networks:
      - escala-net
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    container_name: escala-app
    depends_on:
      - db
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/crescer-aprender-db
      SPRING_DATASOURCE_USERNAME: luiz
      SPRING_DATASOURCE_PASSWORD: luiz123
    networks:
      - escala-net

  sonarqube:
    image: sonarqube:lts-community
    container_name: escala-sonar
    depends_on:
      - db
    ports:
      - "9000:9000"
    networks:
      - escala-net
    environment:
      - SONAR_JDBC_URL=jdbc:postgresql://db:5432/crescer-aprender-db
      - SONAR_JDBC_USERNAME=luiz
      - SONAR_JDBC_PASSWORD=luiz123
      - SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs

networks:
  escala-net:

volumes:
  pgdata:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
