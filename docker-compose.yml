version: '3.8'

services:
  db:
    image: postgres:17
    container_name: javeiro-postgres
    environment:
      POSTGRES_USER: luiz
      POSTGRES_PASSWORD: luiz123
      POSTGRES_DB: crescer-aprender-db
    ports:
      - "5432:5432"
    networks:
      - escala-network
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    container_name: escala-app
    depends_on:
      - db
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/crescer-aprender-db
      SPRING_DATASOURCE_USERNAME: luiz
      SPRING_DATASOURCE_PASSWORD: luiz123
    networks:
      - escala-network

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.115.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./docker/otel-collector-config.yaml:/etc/otelcol/config.yaml
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8889:8889"
    depends_on: [jaeger]
    networks: [escala-network]

  jaeger:
    image: jaegertracing/all-in-one:1.62
    ports:
      - "16686:16686"
      - "14250:14250"
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    networks: [escala-network]

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks: [escala-network]

networks:
  escala-network:
    driver: bridge

volumes:
  pgdata:
