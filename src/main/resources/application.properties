spring.application.name=escala

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/crescer-aprender-db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:luiz}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:luiz123}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

api.security.token.secret=minha-chave

flyway.enabled=true
flyway.locations=classpath:db/migration
flyway.baseline-on-migrate=true
flyway.schemas=public

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.api-docs.enabled=true

springdoc.swagger-ui.url=/swagger.yaml

jwt.secret = teste-de-chave-secreta

# OpenTelemetry
otel.service.name=escala-crescer-aprender-api
otel.service.version=@project.version@
otel.exporter.otlp.endpoint=http://otel-collector:4317
otel.exporter.otlp.protocol=grpc
otel.traces.exporter=otlp
otel.metrics.exporter=otlp
otel.logs.exporter=otlp
otel.propagators=tracecontext,baggage
otel.traces.sampler=parentbased_always_on

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when_authorized
management.metrics.tags.application=${spring.application.name}